const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setSize(1400,600);R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.physicallyCorrectLights=true;document.body.appendChild(R.domElement);

S.add(new THREE.HemisphereLight(0xdde8f0,0x554433,1.6));const D=new THREE.DirectionalLight(0xffffff,3.2);D.position.set(1,2,1.5);S.add(D);const D2=new THREE.DirectionalLight(0xffeedd,1.2);D2.position.set(-2,.5,-1);S.add(D2);
